<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>EduGenie 🎓</h1>

        <p>Google Gemini Powered Educational Assistant</p>

        <textarea
            id="question"
            placeholder="Ask an educational question..."
            rows="5"></textarea>

        <br><br>

        <button onclick="askGemini()">
            Ask EduGenie
        </button>

        <div class="answer">
            <h2>Answer</h2>
            <pre id="answer">Your answer will appear here.</pre>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
